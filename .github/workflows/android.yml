- name: Zip extract
  # You may pin to the exact commit or the version.
  # uses: hoatruongdev09/extract-zip-github-action@dd1eb7883f2792b2baeb525abd0471439e1c6a4e
  uses: hoatruongdev09/extract-zip-github-action@v1.2
  with:
    # zip file path
    input-path: main      
    # extract folder path
    output-path: main
    name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Compilar (debug, já assinado com a chave de debug e instalável)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: passo-a-passo-apk
          path: app/build/outputs/apk/debug/app-debug.apk

