name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair ZIP mais recente da raiz
        run: |
          zip_file="$(find . -maxdepth 1 -type f -iname '*.zip' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          if [ -z "$zip_file" ]; then
            echo "Nenhum arquivo ZIP encontrado na raiz."
            exit 1
          fi
          echo "Extraindo: $zip_file"
          unzip -o -q "$zip_file" -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Compilar (debug, já assinado com a chave de debug e instalável)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: passo-a-passo-apk
          path: app/build/outputs/apk/debug/app-debug.apk
